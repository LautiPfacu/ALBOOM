<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Isotipo de ALBOOM (estallido 3a de design_handoff_alboom_v2/design/ALBOOM Logo.dc.html).
       Sombra rosa girada y corrida + estallido en tinta + agujerito de vinilo.
       En modo oscuro usa la versión "App oscura" para que se vea en la pestaña. -->
  <style>
    .ink { fill: #1F1E2B; }
    .hole { fill: #F5F1E6; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #F5F1E6; }
      .hole { fill: #1F1E2B; }
    }
  </style>
